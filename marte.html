<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Marte - Fobos y Deimos</title>
    <link rel="stylesheet" href="marte.css">
</head>

<body>

    <div class="universo">

        <header class="titulo">
            <a href="planetas.html" class="volver">← Volver a planetas</a>
            <h1>Planeta Marte</h1>
            <p>El planeta rojo, lleno de misterios y valles profundos</p>
        </header>

        <!-- Estrellas de fondo -->
        <div class="estrella e1"></div>
        <div class="estrella e2"></div>
        <div class="estrella e3"></div>
        <div class="estrella e4"></div>
        <div class="estrella e5"></div>
        <div class="estrella e6"></div>
        <div class="estrella e7"></div>
        <div class="estrella e8"></div>

        <!-- Partículas flotantes -->
        <div class="particula p1"></div>
        <div class="particula p2"></div>
        <div class="particula p3"></div>
        <div class="particula p4"></div>

        <!-- Planeta Marte Central -->
        <div class="planeta">
            <div class="mancha m1"></div>
            <div class="mancha m2"></div>
            <div class="mancha m3"></div>
        </div>

        <!-- Luna 1: Fobos (al costado izquierdo) -->
        <div class="contenedor-luna fobos">
            <div class="luna fobos-img">
                <div class="crater cr1"></div>
                <div class="crater cr2"></div>
            </div>
            <span class="nombre-luna">Fobos</span>
        </div>

        <!-- Luna 2: Deimos (al costado derecho) -->
        <div class="contenedor-luna deimos">
            <div class="luna deimos-img">
                <div class="crater cr1"></div>
                <div class="crater cr3"></div>
            </div>
            <span class="nombre-luna">Deimos</span>
        </div>

        <!-- Elementos espaciales adicionales -->
        <div class="nave nave1">🚀</div>
        <div class="nave nave2">🛸</div>
        <div class="cometa">☄️</div>

        <!-- Botón inferior -->
        <a href="index.html" class="boton">
            Ir al Inicio
        </a>

    </div>

</body>
</html>
