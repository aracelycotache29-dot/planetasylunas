<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Tierra - La Luna</title>
    <link rel="stylesheet" href="tierra.css">
</head>

<body>

    <div class="universo">

        <header class="titulo">
            <a href="planetas.html" class="volver">← Volver a planetas</a>
            <h1>Planeta Tierra</h1>
            <p>El único mundo conocido del universo que alberga vida</p>
        </header>

        <!-- Estrellas de fondo -->
        <div class="estrella e1"></div>
        <div class="estrella e2"></div>
        <div class="estrella e3"></div>
        <div class="estrella e4"></div>
        <div class="estrella e5"></div>
        <div class="estrella e6"></div>
        <div class="estrella e7"></div>
        <div class="estrella e8"></div>

        <!-- Partículas flotantes -->
        <div class="particula p1"></div>
        <div class="particula p2"></div>
        <div class="particula p3"></div>
        <div class="particula p4"></div>

        <!-- Planeta Tierra Central -->
        <div class="planeta">
            <div class="continente c1"></div>
            <div class="continente c2"></div>
            <div class="continente c3"></div>
        </div>

        <!-- Contenedor estático de la Luna al costado del planeta -->
        <div class="contenedor-luna">
            <div class="luna">
                <div class="crater cr1"></div>
                <div class="crater cr2"></div>
                <div class="crater cr3"></div>
            </div>
            <span class="nombre-luna">Luna</span>
        </div>

        <!-- Elementos espaciales adicionales -->
        <div class="nave nave1">🚀</div>
        <div class="nave nave2">🛸</div>
        <div class="cometa">☄️</div>

        <!-- Botón inferior -->
        <a href="index.html" class="boton">
            Ir al Inicio
        </a>

    </div>

</body>
</html>
