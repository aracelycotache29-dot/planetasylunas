<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Neptuno y sus 16 Lunas en Forma de Corazón</title>
    <link rel="stylesheet" href="neptuno.css">
</head>

<body>

    <div class="universo" id="escenario">

        <header class="titulo">
            <a href="planetas.html" class="volver">← Volver a planetas</a>
            <h1>Planeta Neptuno</h1>
            <p>16 lunas en forma de corazón, totalmente separadas y seguras</p>
        </header>

        <!-- Estrellas de fondo -->
        <div class="estrella e1"></div>
        <div class="estrella e2"></div>
        <div class="estrella e3"></div>
        <div class="estrella e4"></div>
        <div class="estrella e5"></div>
        <div class="estrella e6"></div>
        <div class="estrella e7"></div>
        <div class="estrella e8"></div>

        <!-- Planeta Neptuno Central con Anillos -->
        <div class="planeta-contenedor" id="neptuno-centro">
            <div class="anillo-trasero"></div>
            <div class="planeta" id="planeta-neptuno"></div>
            <div class="anillo-frontal"></div>
        </div>

        <!-- Contenedor general para las 16 lunas -->
        <div id="contenedor-lunas"></div>

        <!-- Elementos espaciales -->
        <div class="nave nave1">🚀</div>
        <div class="nave nave2">🛸</div>
        <div class="cometa">☄️</div>

        <!-- Botón inferior -->
        <a href="index.html" class="boton">
            Ir al Inicio
        </a>

    </div>

    <script>
        const baseLunas = [
            "Tritón", "Proteo", "Nereida", "Larisa", "Despina",
            "Galatea", "Proteo", "Larissa", "Náyade", "Talasa",
            "Halimede", "Sao", "Laomedeia", "Neso", "Hipocampo", "S/2004 N 1"
        ];

        const nombresLunas = [];
        while (nombresLunas.length < 16) {
            nombresLunas.push(baseLunas[nombresLunas.length] || `S/2021 N ${nombresLunas.length}`);
        }

        const lunasGrandes = ["Tritón", "Proteo", "Nereida", "Larisa", "Despina"];
        const contenedor = document.getElementById('contenedor-lunas');

        function inicializarLunas() {
            contenedor.innerHTML = '';

            const anchoPantalla = window.innerWidth;
            const altoPantalla = window.innerHeight;

            const centroX = anchoPantalla / 2;
            const centroY = altoPantalla / 2;

            const radioExclusionPlaneta = 140; 
            const escalaFigura = 11; 
            const desplazamientoY = 20;

            const posicionesLunas = [];

            function calcularDistancia(x1, y1, x2, y2) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                return Math.sqrt(dx * dx + dy * dy);
            }

            const fragmento = document.createDocumentFragment();

            nombresLunas.forEach((nombre, index) => {
                const esGrande = lunasGrandes.includes(nombre);
                // Margen de seguridad personalizado según el tamaño de la luna/etiqueta
                const margenSeguridad = esGrande ? 42 : 25; 

                // --- FORMULA MATEMÁTICA: CORAZÓN ---
                const t = (index / nombresLunas.length) * 2 * Math.PI;
                
                let xRel = 16 * Math.pow(Math.sin(t), 3);
                let yRel = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                let xValida = centroX + (xRel * escalaFigura);
                let yValida = centroY + desplazamientoY + (yRel * escalaFigura);

                // 1. Evitar choque con el planeta central
                const dxPlaneta = xValida - centroX;
                const dyPlaneta = yValida - centroY;
                const distanciaCentro = Math.sqrt(dxPlaneta * dxPlaneta + dyPlaneta * dyPlaneta);

                if (distanciaCentro < radioExclusionPlaneta) {
                    const factor = radioExclusionPlaneta / (distanciaCentro || 1);
                    xValida = centroX + dxPlaneta * factor;
                    yValida = centroY + dyPlaneta * factor;
                }

                // 2. Evitar choques entre las lunas ya ubicadas
                let intentosChoque = 0;
                let hayChoque = true;

                while (hayChoque && intentosChoque < 30) {
                    hayChoque = false;
                    for (let pos of posicionesLunas) {
                        const distanciaEntreLunas = calcularDistancia(xValida, yValida, pos.x, pos.y);
                        const distanciaMinimaRequerida = margenSeguridad + pos.margen;

                        if (distanciaEntreLunas < distanciaMinimaRequerida) {
                            hayChoque = true;
                            // Empujar ligeramente hacia afuera del centro para deshacer el solapamiento
                            const anguloEmpuje = Math.atan2(yValida - centroY, xValida - centroX);
                            xValida += Math.cos(anguloEmpuje) * 10;
                            yValida += Math.sin(anguloEmpuje) * 10;
                            break;
                        }
                    }
                    intentosChoque++;
                }

                // Guardar posición definitiva
                posicionesLunas.push({ x: xValida, y: yValida, margen: margenSeguridad });

                const elemLuna = document.createElement('div');
                elemLuna.className = esGrande ? 'contenedor-luna-principal' : 'contenedor-luna-menor';
                elemLuna.style.left = `${xValida}px`;
                elemLuna.style.top = `${yValida}px`;

                const delay = (Math.random() * 4).toFixed(2);
                const duracion = (Math.random() * 2 + 3).toFixed(2);
                elemLuna.style.animationDelay = `${delay}s`;
                elemLuna.style.animationDuration = `${duracion}s`;

                const cuerpoLuna = document.createElement('div');
                if (esGrande) {
                    cuerpoLuna.className = `luna luna-${nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '')}`;
                } else {
                    cuerpoLuna.className = 'punto-luna';
                }

                const etiqueta = document.createElement('span');
                etiqueta.className = esGrande ? 'nombre-luna-principal' : 'etiqueta-luna';
                etiqueta.textContent = nombre;

                elemLuna.appendChild(cuerpoLuna);
                elemLuna.appendChild(etiqueta);
                fragmento.appendChild(elemLuna);
            });

            contenedor.appendChild(fragmento);
        }

        window.addEventListener('DOMContentLoaded', inicializarLunas);
    </script>

</body>
</html>
